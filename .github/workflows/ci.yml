name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Minimo privilegio: la CI solo lee el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    # Windows es el entorno verificado. Linux y macOS quedan en PENDIENTES
    # (distribucion) hasta correr la suite ahi al menos una vez.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencias (desde uv.lock, sin actualizar)
        run: uv sync --extra dev --locked

      - name: Lint
        run: uv run --extra dev ruff check src tests

      - name: Pruebas
        run: uv run --extra dev pytest -q

      - name: Estilos de las maquetas sincronizados
        run: node design/estilos/sincronizar.mjs --check

  docker:
    # La imagen de servidor (agenda y webhooks): se construye, arranca y responde.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir
        run: docker build -t lymi:ci .
      - name: Arranca y responde en /salud
        run: |
          docker run -d --name lymi -p 8765:8765 lymi:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/salud; then exit 0; fi
            sleep 2
          done
          docker logs lymi
          exit 1
