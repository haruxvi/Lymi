[project]
name = "lymi"
version = "0.0.1"
description = "Orquestador de agentes multi-proveedor con contabilidad de tokens y control de egress auditables."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "keyring>=25.7.0",
    "mcp>=2,<3",
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
    "rich>=13.7",
    "starlette>=1.6.0",
    "typer>=0.12",
    "tzdata>=2026.4",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
lymi = "lymi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lymi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Aviso interno del TestClient de Starlette sobre un alias de anyio: no es codigo de
# lymi. Filtrado por mensaje exacto para que un aviso propio nunca quede tapado.
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
